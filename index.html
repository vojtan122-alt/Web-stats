<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>Weby & zisk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap">
<style>
:root{--bl:22px;--o1:#2dd4bf;--o2:#7c3aed;--bg:#0b1020;--tx:#eef1fb;--mu:#8d96b5;--ac:#5eead4;--ac2:#a78bfa;--bad:#fb7185;--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Sora,-apple-system,system-ui,sans-serif}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(130px + env(safe-area-inset-bottom,0px))}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.6;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
.o1{width:360px;height:360px;background:var(--o1);top:-100px;right:-120px}
.o2{width:420px;height:420px;background:var(--o2);bottom:-160px;left:-140px;animation-delay:-8s}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}
main{max-width:920px;margin:auto}
h1{font-size:28px;font-weight:300;margin:0 0 4px;letter-spacing:-.02em}
h1 b{font-weight:700}
h2{font-size:20px;font-weight:600;margin:0 0 18px}
.sub{color:var(--mu);font-size:14px;margin-bottom:22px}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 55%,rgba(255,255,255,.09));border:1px solid rgba(255,255,255,.2);border-radius:26px;backdrop-filter:blur(var(--bl)) saturate(190%);-webkit-backdrop-filter:blur(var(--bl)) saturate(190%);box-shadow:0 10px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:transparent;color:var(--mu);font:inherit;font-size:13px;padding:8px 15px;border-radius:99px;cursor:pointer;transition:.25s}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06101c;border-color:transparent;font-weight:600}
.dates{display:flex;gap:10px;margin-bottom:16px}
.dates input{flex:1;min-width:0}
input,select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:14px;color:var(--tx);font:inherit;font-size:15px;padding:12px 14px;outline:none;color-scheme:dark}
input:focus,select:focus{border-color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 6px}
.hero{padding:26px 24px;margin-bottom:14px;position:relative;overflow:hidden}
.hero small{color:var(--mu);font-size:13px}
.big{font-size:clamp(40px,11vw,64px);font-weight:700;letter-spacing:-.04em;line-height:1.1;margin-top:4px;background:linear-gradient(120deg,#fff,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.big.neg{background:linear-gradient(120deg,#fff,var(--bad));-webkit-background-clip:text;background-clip:text}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{padding:18px}.stat small{color:var(--mu);font-size:12px}.stat div{font-size:20px;font-weight:600;margin-top:6px}
.chart{height:230px;position:relative;margin:6px 0 8px;display:flex;gap:3px;padding:0 4px}
.col{flex:1;position:relative;min-width:0}
.bar{position:absolute;left:12%;right:12%;border-radius:6px;background:linear-gradient(180deg,var(--ac),var(--ac2));transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bar.n{background:linear-gradient(180deg,var(--bad),#f97316);transform-origin:top}
@keyframes grow{from{transform:scaleY(0)}}
.lbls{display:flex;gap:3px;padding:0 4px;color:var(--mu);font-size:10px}.lbls span{flex:1;text-align:center;white-space:nowrap;overflow:visible}
.card{padding:16px 18px;margin-bottom:12px;cursor:pointer;animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nm{font-weight:600;font-size:16px}.cl{color:var(--mu);font-size:13px;margin-top:2px}
.tag{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid}
.sold{color:var(--ac);border-color:var(--ac)}.wip{color:#fbbf24;border-color:#fbbf24}.done{color:var(--ac2);border-color:var(--ac2)}
.mo{display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--mu)}.mo b{color:var(--tx);font-weight:600}
.steps{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.st{font:inherit;font-size:12px;padding:8px 13px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--mu);cursor:pointer;transition:.25s}
.st.on{background:rgba(94,234,212,.16);color:var(--ac);border-color:var(--ac)}
.st.no{background:rgba(251,113,133,.15);color:var(--bad);border-color:var(--bad)}
.empty{text-align:center;color:var(--mu);padding:50px 10px;font-size:14px}
.fab{position:fixed;right:22px;bottom:calc(112px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;font-size:30px;color:#06101c;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 30px rgba(94,234,212,.35);cursor:pointer;z-index:20;transition:transform .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:8px;z-index:30;border-radius:99px;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(var(--bl)) saturate(210%);-webkit-backdrop-filter:blur(var(--bl)) saturate(210%);box-shadow:0 14px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -8px 20px rgba(255,255,255,.04)}
nav button{position:relative;z-index:1;width:56px;height:52px;border:0;background:transparent;color:var(--mu);border-radius:99px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font:inherit;font-size:11px;transition:color .3s}
nav button span{display:none}
nav button.on{color:#fff}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .bub{position:absolute;z-index:0;border-radius:99px;pointer-events:none;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.42),rgba(255,255,255,.12) 62%);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 2px 6px rgba(255,255,255,.55),0 6px 20px rgba(0,0,0,.3);transition:left .5s cubic-bezier(.3,1.5,.5,1),top .5s cubic-bezier(.3,1.5,.5,1),transform .35s cubic-bezier(.3,1.6,.5,1)}
nav.drag .bub{transform:scale(1.4,1.3);transition:transform .35s cubic-bezier(.3,1.6,.5,1),left .09s linear,top .09s linear}
.rev{animation:rev 1.4s ease both}@keyframes rev{from{clip-path:inset(-10px 100% -10px 0)}}
.set{padding:16px 18px;margin-bottom:12px}.set>label:first-child{margin-top:0}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{height:58px;border-radius:18px;border:2px solid transparent;color:#06101c;font:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:6px}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.tgl{width:52px;height:30px;border-radius:99px;border:1px solid var(--bd);background:rgba(255,255,255,.1);position:relative;cursor:pointer;transition:.3s}
.tgl:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s}
.tgl.on{background:var(--ac)}.tgl.on:after{left:25px}
input[type=range]{padding:0;accent-color:var(--ac)}
.noan *{animation:none!important}
#lock{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg)}#lock.on{display:flex}.lk{width:100%;max-width:360px;padding:32px 24px;text-align:center;animation:up .5s both}.lk input{text-align:center;margin:18px 0 0}.lk small{display:block;color:var(--mu);font-size:12px;line-height:1.55;margin-top:20px}.lk .btns{margin-top:14px;flex-direction:column}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.6);backdrop-filter:blur(6px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:rgba(20,26,48,.72);animation:sl .35s cubic-bezier(.2,.9,.3,1)}
@keyframes sl{from{transform:translateY(100%)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:10px;margin-top:22px}
.btns button{flex:1;font:inherit;font-weight:600;padding:14px;border-radius:16px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer}
.btns .pr{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06101c;border:0}
.btns .del{flex:.5;color:var(--bad)}
@media(min-width:720px){
 body{padding:44px 40px 60px 150px}
 .grid{grid-template-columns:repeat(4,1fr)}
 nav{left:22px;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;border-radius:34px;width:104px}
 nav button{width:100%;height:auto;padding:14px 4px;border-radius:26px}
 nav button span{display:block}
 nav .bub{border-radius:26px}
 .fab{bottom:36px;right:40px}
 .modal{align-items:center}.sheet{border-radius:28px}
 .list{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<i class="orb o1"></i><i class="orb o2"></i>
<main id="app"></main>
<button class="fab" id="fab" onclick="openM()" aria-label="Přidat web">+</button>
<nav id="nav"></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>

<div id="lock"><form class="glass lk" onsubmit="member();return false"><h2 style="margin-bottom:6px">Weby &amp; zisk</h2><div class="sub" id="lk_st" style="margin:0">Zadej své jméno</div>
<input id="lk_nm" placeholder="Jméno" autocomplete="off" autocapitalize="off" autocorrect="off">
<div class="btns"><button type="button" onclick="register()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:8px"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.6-3.600 3.200-5.500 6.500-5.500M18 9v6M15 12h6"/></svg>Registrace</button><button type="submit" class="pr"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:8px"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-3.800 3.500-5.800 7-5.800s6.400 2 7 5.800"/></svg>Člen</button></div>
<small>Jméno slouží jen k identifikaci, není to zabezpečení. Kdokoli, kdo zadá stejné jméno, uvidí stejné statistiky a údaje. V appce není nic citlivého.</small></form></div>
<script>
const $=s=>document.querySelector(s);
const ICO={
home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>',
chart:'<path d="M4 19V5"/><path d="M4 19h16"/><path d="m7.5 14 3.5-4 3 2.5 4.5-6"/>',
web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.7 2.7 3.8 5.7 3.8 9s-1.1 6.3-3.8 9c-2.7-2.7-3.8-5.7-3.8-9S9.300 5.700 12 3z"/>',
people:'<circle cx="9" cy="8.500" r="3.200"/><path d="M3 19c.5-3.200 3-5 6-5s5.500 1.800 6 5"/><circle cx="17" cy="9.500" r="2.500"/><path d="M17.500 14.200c2 .3 3.200 1.800 3.500 4.300"/>'};
const TABS=[['home','Domů'],['chart','Graf'],['web','Weby'],['people','Klienti'],['set','Nastavení']];
ICO.set='<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>';
let tab='home',sel=null;
const R={home:{k:'month'},chart:{k:'month'}};
let D=(()=>{try{return JSON.parse(localStorage.getItem('webzisk'))||[]}catch(e){return[]}})();
const save=()=>{try{localStorage.setItem('webzisk',JSON.stringify(D));localStorage.setItem('webzisk_ts',Date.now())}catch(e){}push()};
const TH={aqua:['Aqua','#5eead4','#a78bfa','#2dd4bf','#7c3aed','#0b1020'],sunset:['Západ','#fdba74','#f472b6','#fb923c','#db2777','#170d14'],forest:['Les','#86efac','#67e8f9','#22c55e','#0891b2','#08140f'],ocean:['Oceán','#7dd3fc','#818cf8','#0ea5e9','#4f46e5','#080f1f']};
let S=Object.assign({name:'Vojto',th:'aqua',cur:'Kč',bl:22,an:1},(()=>{try{return JSON.parse(localStorage.getItem('webzisk_s'))||{}}catch(e){return{}}})());
const kc=n=>Math.round(n).toLocaleString('cs-CZ')+' '+S.cur;
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dfmt=s=>s?s.split('-').reverse().map(Number).join('. ')[0]&&(()=>{const[y,m,d]=s.split('-');return+d+'. '+ +m+'. '+y})():'';

const cap=t=>t.replace(/(^|\s)\S/g,c=>c.toUpperCase()),disp=()=>S.name||cap(U);
function greet(){const h=new Date().getHours();
 return (h<5?'Dobrou noc':h<10?'Dobré ráno':h<12?'Dobré dopoledne':h<18?'Dobré odpoledne':'Dobrý večer')+', '}
function span(r){const n=new Date(),t=iso(n),k=r.k;
 if(k==='day')return[t,t];
 if(k==='week'){const d=new Date(n);d.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(d);e.setDate(e.getDate()+6);return[iso(d),iso(e)]}
 if(k==='month')return[iso(new Date(n.getFullYear(),n.getMonth(),1)),iso(new Date(n.getFullYear(),n.getMonth()+1,0))];
 if(k==='year')return[n.getFullYear()+'-01-01',n.getFullYear()+'-12-31'];
 return[r.a||t,r.b||t]}
const profit=w=>(+w.price||0)-(+w.cost||0);
function stats(r){const[a,b]=span(r);const s=D.filter(w=>w.status==='sold'&&w.date>=a&&w.date<=b);
 const rev=s.reduce((x,w)=>x+(+w.price||0),0),inv=s.reduce((x,w)=>x+(+w.cost||0),0);
 return{s,rev,inv,net:rev-inv,a,b}}

function chips(key){const L=[['day','Den'],['week','Týden'],['month','Měsíc'],['year','Rok'],['custom','Od–do']];const r=R[key];
 return `<div class="chips">${L.map(([k,t])=>`<button class="chip ${r.k===k?'on':''}" onclick="setR('${key}','${k}')">${t}</button>`).join('')}</div>`+
 (r.k==='custom'?`<div class="dates"><input type="date" value="${r.a||''}" onchange="R.${key}.a=this.value;draw()"><input type="date" value="${r.b||''}" onchange="R.${key}.b=this.value;draw()"></div>`:'')}
function setR(key,k){R[key].k=k;if(k==='custom'&&!R[key].a){const[a,b]=span({k:'month'});R[key].a=a;R[key].b=b}draw()}

function hero(st,label){return `<div class="glass hero"><small>${label}</small><div class="big ${st.net<0?'neg':''}">${kc(st.net)}</div></div>`}

function vHome(){const st=stats(R.home);
 const wip=D.filter(w=>w.status!=='sold').length;
 return `<h1>${greet()}<b>${esc(disp())}</b></h1><div class="sub">Tady je přehled tvých webů.</div>${chips('home')}${hero(st,'Čistý zisk')}
 <div class="grid"><div class="glass stat"><small>Tržby</small><div>${kc(st.rev)}</div></div><div class="glass stat"><small>Investice</small><div>${kc(st.inv)}</div></div>
 <div class="glass stat"><small>Prodáno webů</small><div>${st.s.length}</div></div><div class="glass stat"><small>Rozpracováno</small><div>${wip}</div></div></div>`}

function vChart(){const st=stats(R.chart),a=new Date(st.a),b=new Date(st.b);const days=Math.round((b-a)/864e5)+1;
 const monthly=days>62,m={},keys=[];
 for(let d=new Date(a),i=0;d<=b&&i<800;d.setDate(d.getDate()+1),i++){const k=iso(d).slice(0,monthly?7:10);if(!(k in m)){m[k]=0;keys.push(k)}}
 st.s.forEach(w=>{const k=w.date.slice(0,monthly?7:10);if(k in m)m[k]+=profit(w)});
 const v=keys.map(k=>m[k]),mx=Math.max(0,...v),mn=Math.min(0,...v),rg=(mx-mn)||1,step=Math.ceil(keys.length/6),W=600,H=220;
 const lab=k=>{const p=k.split('-');return monthly?+p[1]+'/'+p[0].slice(2):+p[2]+'.'+ +p[1]+'.'};
 const P=v.map((x,i)=>[keys.length>1?i/(keys.length-1)*W:0,14+(1-(x-mn)/rg)*(H-34)]);
 if(P.length<2)P.push([W,P[0][1]]);
 let d='M'+P[0][0]+','+P[0][1];
 for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
  d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}
 const area=d+`L${W},${H}L0,${H}Z`,zy=14+(1-(0-mn)/rg)*(H-34);
 const svg=`<svg class="rev" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:230px;display:block;overflow:visible"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.6"/><stop offset="1" style="stop-color:var(--ac2);stop-opacity:0"/></linearGradient><linearGradient id="gs" x1="0" x2="1"><stop offset="0" style="stop-color:var(--ac)"/><stop offset="1" style="stop-color:var(--ac2)"/></linearGradient></defs>
 <line x1="0" x2="${W}" y1="${zy}" y2="${zy}" stroke="rgba(255,255,255,.18)" stroke-dasharray="4 6" vector-effect="non-scaling-stroke"/>
 <path d="${area}" fill="url(#gf)"/><path d="${d}" fill="none" stroke="url(#gs)" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
 return `<h2>Jak se ti daří</h2>${hero(st,'Čistý zisk')}${chips('chart')}
 <div class="glass" style="padding:18px 14px 12px">${st.s.length?svg+`<div class="lbls" style="margin-top:8px">${keys.map((k,i)=>`<span>${i%step===0?lab(k):''}</span>`).join('')}</div>`:'<div class="empty">V tomto období zatím žádný prodej.</div>'}</div>`}

const ST={sold:['Prodáno','sold'],wip:['Rozpracováno','wip'],done:['Hotovo, neprodáno','done']};
function vWeb(){return `<h2>Moje weby</h2>`+(D.length?`<div class="list">${[...D].reverse().map((w,i)=>`<div class="glass card" style="animation-delay:${i*50}ms" onclick="openM('${w.id}')">
 <div class="row"><div><div class="nm">${esc(w.name)}</div><div class="cl">${esc(w.client)||'bez klienta'}</div></div><span class="tag ${ST[w.status][1]}">${ST[w.status][0]}</span></div>
 <div class="mo"><span>Investice <b>${kc(w.cost)}</b></span><span>Cena <b>${kc(w.price)}</b></span><span>Zisk <b>${kc(profit(w))}</b></span></div></div>`).join('')}</div>`:'<div class="empty">Zatím tu nic není.<br>Klepni na + a přidej první web.</div>')}

function vPeople(){return `<h2>Klienti</h2>`+(D.length?`<div class="list">${[...D].reverse().map((w,i)=>`<div class="glass card" style="animation-delay:${i*50}ms;cursor:default">
 <div class="nm">${esc(w.name)}</div><div class="cl">${esc(w.client)||'bez klienta'}</div>
 <div class="steps"><button class="st ${w.sent?'on':''}" onclick="tg('${w.id}','sent')">${w.sent?'✓ ':''}Zpráva odeslána</button>
 <button class="st ${w.replied?'on':''}" onclick="tg('${w.id}','replied')">${w.replied?'✓ ':''}Odpověděl</button>
 <button class="st ${w.res==='yes'?'on':w.res==='no'?'no':''}" onclick="tg('${w.id}','res')">${w.res==='yes'?'✓ Přijal':w.res==='no'?'✕ Odmítl':'Čeká na rozhodnutí'}</button></div></div>`).join('')}</div>`:'<div class="empty">Nejdřív přidej web v sekci Weby.</div>')}

function tg(id,f){const w=D.find(x=>x.id===id);if(f==='res')w.res=!w.res?'yes':w.res==='yes'?'no':'';else w[f]=!w[f];save();draw()}

function openM(id){sel=id?D.find(x=>x.id===id):null;const w=sel||{name:'',client:'',price:'',cost:'',status:'wip',date:iso(new Date())};
 $('#sheet').className='sheet glass';
 $('#sheet').innerHTML=`<h2>${sel?'Upravit web':'Nový web'}</h2>
 <label>Název webu</label><input id="f_name" value="${esc(w.name)}" placeholder="např. Kadeřnictví Nováková">
 <label>Klient</label><input id="f_client" value="${esc(w.client)}" placeholder="jméno klienta">
 <div class="two"><div><label>Investoval jsem (Kč)</label><input id="f_cost" type="number" inputmode="decimal" value="${w.cost}"></div>
 <div><label>Prodáno za (Kč)</label><input id="f_price" type="number" inputmode="decimal" value="${w.price}"></div></div>
 <div class="two"><div><label>Stav</label><select id="f_status"><option value="wip" ${w.status==='wip'?'selected':''}>Rozpracováno</option><option value="done" ${w.status==='done'?'selected':''}>Hotovo, neprodáno</option><option value="sold" ${w.status==='sold'?'selected':''}>Prodáno</option></select></div>
 <div><label>Datum prodeje</label><input id="f_date" type="date" value="${w.date}"></div></div>
 <div class="btns">${sel?'<button class="del" onclick="del()">Smazat</button>':''}<button onclick="closeM()">Zrušit</button><button class="pr" onclick="saveW()">Uložit</button></div>`;
 $('#modal').classList.add('open')}
function closeM(){$('#modal').classList.remove('open')}
function saveW(){const g=i=>$('#f_'+i).value;if(!g('name').trim()){$('#f_name').focus();return}
 const o={name:g('name').trim(),client:g('client').trim(),cost:+g('cost')||0,price:+g('price')||0,status:g('status'),date:g('date')};
 if(sel)Object.assign(sel,o);else D.push({id:Date.now().toString(36),sent:false,replied:false,res:'',...o});
 save();closeM();draw()}
function ask(t,cb){$('#sheet').className='sheet glass';$('#sheet').innerHTML=`<h2>${t}</h2><div class="btns">${cb?'<button onclick="closeM()">Zrušit</button><button class="pr" style="background:linear-gradient(135deg,#fb7185,#f97316);color:#fff" onclick="askOk()">Smazat</button>':'<button class="pr" onclick="closeM()">OK</button>'}</div>`;window._cb=cb;$('#modal').classList.add('open')}
function askOk(){const f=window._cb;closeM();if(f)f()}
function del(){const w=sel;ask('Smazat web „'+esc(w.name)+'“?',()=>{D=D.filter(x=>x!==w);save();draw()})}

function vSet(){return `<h2>Nastavení</h2>
<div class="glass set"><label>Oslovení na domovské stránce</label><input value="${esc(S.name)}" oninput="ss('name',this.value)" placeholder="Vojto"></div>
<div class="glass set"><label>Vzhled</label><div class="themes">${Object.entries(TH).map(([k,t])=>`<button class="sw ${S.th===k?'on':''}" onclick="ss('th','${k}',1)" style="background:linear-gradient(135deg,${t[1]},${t[2]})">${t[0]}</button>`).join('')}</div>
<label>Síla skla (rozmazání)</label><input type="range" min="6" max="40" value="${S.bl}" oninput="ss('bl',+this.value)"></div>
<div class="glass set"><label>Měna</label><select onchange="ss('cur',this.value)">${['Kč','€','$'].map(c=>`<option ${S.cur===c?'selected':''}>${c}</option>`).join('')}</select>
<div class="row" style="margin-top:18px"><span>Animace</span><button class="tgl ${S.an?'on':''}" onclick="ss('an',S.an?0:1,1)" aria-label="Animace"></button></div></div>
<div class="glass set"><label>Účet</label>${U?`<div class="row"><span>Přihlášen jako <b>${esc(U)}</b></span><button class="chip" onclick="showLock()">Odhlásit</button></div>`:'<div class="cl">Cloud není nastaven. Vlož URL a klíč Supabase do řádku CF v souboru.</div>'}<div class="cl" id="c_st" style="margin-top:12px"></div></div>
<div class="glass set"><label>Data</label><div class="btns" style="margin-top:6px"><button onclick="exp()">Exportovat zálohu</button><button onclick="$('#imp').click()">Importovat</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"><div class="btns"><button class="del" onclick="wipe()">Smazat všechna data</button></div></div>
<div class="sub" style="text-align:center">Data jsou uložená jen v tomto zařízení.</div>`}
function ss(k,v,re){S[k]=v;try{localStorage.setItem('webzisk_s',JSON.stringify(S));localStorage.setItem('webzisk_ts',Date.now())}catch(e){}push();applyS();if(re)draw()}
function applyS(){const t=TH[S.th]||TH.aqua,r=document.documentElement.style;['--ac','--ac2','--o1','--o2','--bg'].forEach((k,i)=>r.setProperty(k,t[i+1]));r.setProperty('--bl',S.bl+'px');document.body.classList.toggle('noan',!S.an)}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='weby-zaloha.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t);if(Array.isArray(x)){D=x;save();draw()}}catch(e){ask('Soubor se nepodařilo načíst.')}})}
function wipe(){ask('Smazat všechny weby? Nejde to vrátit.',()=>{D=[];save();draw()})}

const CF={url:'https://qoovbtqmpfpwxbmhjmvf.supabase.co',key:'sb_publishable__PUcfXeSTOcMM8a3DYfxng_BPxbnUnI'}; // sem JEDNOU vlož URL a klíč Supabase, v appce pak už nic nenastavuješ
const C={url:CF.url,key:CF.key};let U='',pend=false;
const sm=m=>{const e=$('#c_st');if(e)e.textContent=m};
const rpc=(f,b)=>fetch(C.url.replace(/\/$/,'')+'/rest/v1/rpc/'+f,{method:'POST',headers:Object.assign({apikey:C.key,'Content-Type':'application/json'},C.key.indexOf('sb_')===0?{}:{Authorization:'Bearer '+C.key}),body:JSON.stringify(b)});
function showLock(){U='';$('#lk_nm').value=localStorage.getItem('webzisk_u')||'';$('#lk_st').textContent='Zadej své jméno';$('#lock').classList.add('on')}
function enter(){try{localStorage.setItem('webzisk_u',U)}catch(e){}$('#lock').classList.remove('on');draw()}
const nm=()=>$('#lk_nm').value.trim().toLowerCase();
function take(row){D=row.data.d||[];Object.assign(S,row.data.s||{});if(!(row.data.s&&row.data.s.name))S.name=cap(U);try{localStorage.setItem('webzisk',JSON.stringify(D));localStorage.setItem('webzisk_s',JSON.stringify(S))}catch(e){}applyS()}
async function member(){const n=nm(),st=$('#lk_st');if(n.length<2){st.textContent='Zadej jméno (aspoň 2 znaky).';return}st.textContent='Načítám…';
 try{const r=await rpc('load_data',{nm:n});if(!r.ok){st.textContent='Chyba serveru ('+r.status+'). Spustil jsi SQL?';return}
  const a=await r.json();if(!a.length){st.textContent='Takový uživatel neexistuje. Nejdřív se zaregistruj.';return}
  U=n;take(a[0]);enter()}catch(e){st.textContent='Bez připojení k internetu.'}}
async function register(){const n=nm(),st=$('#lk_st');if(n.length<2){st.textContent='Zadej jméno (aspoň 2 znaky).';return}st.textContent='Registruji…';
 const first=!localStorage.getItem('webzisk_u');
 try{const r=await rpc('register_user',{nm:n,d:{d:first?D:[],s:Object.assign({},S,{name:cap(n)})},ts:new Date().toISOString()});if(!r.ok){st.textContent='Chyba serveru ('+r.status+'). Spustil jsi SQL?';return}
  if(!(await r.json())){st.textContent='Tento uživatel již existuje.';return}
  S.name=cap(n);try{localStorage.setItem('webzisk_s',JSON.stringify(S))}catch(e){}
  if(!first){D=[];try{localStorage.setItem('webzisk','[]')}catch(e){}}
  U=n;enter()}catch(e){st.textContent='Bez připojení k internetu.'}}
let pt;function push(){if(!U)return;pend=true;clearTimeout(pt);pt=setTimeout(async()=>{try{const r=await rpc('save_data',{nm:U,d:{d:D,s:S},ts:new Date().toISOString()});sm(r.ok?'Uloženo '+new Date().toLocaleTimeString('cs-CZ'):'Uložení selhalo ('+r.status+')')}catch(e){sm('Bez připojení – změna se neuložila.')}pend=false},600)}
async function pull(){if(!U||pend||$('#modal').classList.contains('open'))return;try{const r=await rpc('load_data',{nm:U});if(!r.ok)return;const a=await r.json();if(a[0]&&!pend){take(a[0]);draw()}}catch(e){}}
function buildNav(){const n=$('#nav');n.innerHTML='<i class="bub"></i>'+TABS.map(([k,t])=>`<button aria-label="${t}"><svg viewBox="0 0 24 24">${ICO[k]}</svg><span>${t}</span></button>`).join('');
 const bs=()=>[...n.querySelectorAll('button')],bub=n.querySelector('.bub'),vert=()=>matchMedia('(min-width:720px)').matches;
 const rest=i=>{const b=bs()[i];bub.style.width=b.offsetWidth+'px';bub.style.height=b.offsetHeight+'px';bub.style.left=b.offsetLeft+'px';bub.style.top=b.offsetTop+'px'};
 window.navSet=()=>{bs().forEach((b,i)=>b.classList.toggle('on',TABS[i][0]===tab));rest(TABS.findIndex(t=>t[0]===tab))};
 const near=e=>{const r=n.getBoundingClientRect(),v=vert(),p=v?e.clientY-r.top:e.clientX-r.left;let bi=0,bd=1e9;bs().forEach((b,i)=>{const c=v?b.offsetTop+b.offsetHeight/2:b.offsetLeft+b.offsetWidth/2,d=Math.abs(c-p);if(d<bd){bd=d;bi=i}});return[bi,p]};
 const mv=e=>{const[i,p]=near(e),v=vert(),b=bs()[i];bs().forEach((x,j)=>x.classList.toggle('on',j===i));
  if(v)bub.style.top=Math.max(0,Math.min(n.offsetHeight-b.offsetHeight,p-b.offsetHeight/2))+'px';else bub.style.left=Math.max(0,Math.min(n.offsetWidth-b.offsetWidth,p-b.offsetWidth/2))+'px'};
 let on=false;
 n.addEventListener('pointerdown',e=>{on=true;n.setPointerCapture(e.pointerId);n.classList.add('drag');mv(e)});
 n.addEventListener('pointermove',e=>{if(on)mv(e)});
 const end=e=>{if(!on)return;on=false;n.classList.remove('drag');const[i]=near(e);go(TABS[i][0]);navSet()};
 n.addEventListener('pointerup',end);n.addEventListener('pointercancel',end);
 addEventListener('resize',()=>navSet());navSet()}
function draw(){navSet();$('#fab').style.display=tab==='web'?'block':'none';
 $('#app').innerHTML=({home:vHome,chart:vChart,web:vWeb,people:vPeople,set:vSet})[tab]()}
function go(t){if(t===tab)return;tab=t;scrollTo({top:0});draw()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
applyS();buildNav();draw();if(C.url&&C.key)showLock();addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script>
</body>
